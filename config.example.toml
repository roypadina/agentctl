# Agentctl config — copy to ~/.config/agentctl/config.toml and edit (`agentctl config --setup`).

# Optional. Which tool's launcher is primary (informational).
default_tool = "claude"

# Claude Code permission mode for the built-in claude tool and for Resume.
#   "auto" (default)        — Claude Code auto mode (--permission-mode auto)
#   "bypassPermissions"     — opt in to --dangerously-skip-permissions
# A [[tool]] `runs` line below is used verbatim; this key does not rewrite it.
# permission_mode = "auto"

# ─── dir groups ──────────────────────────────────────────────────────────────
# Each group is a section in the New screen. `path` is scanned one level deep for
# project dirs, sorted by `z` frecency (falls back to mtime). ~ and $HOME expand.
[[group]]
name  = "Frontend"
path  = "~/code/frontend"
color = "#6C91BF"

[[group]]
name  = "Backend"
path  = "~/code/backend"
color = "#A855F7"

# ─── tools ───────────────────────────────────────────────────────────────────
# Each tool generates a launcher command named `name`. `runs` is a shell command
# executed in the chosen dir. Adding/removing a tool takes effect in a NEW shell.
[[tool]]
name  = "claude"
runs  = "claude --permission-mode auto"
label = " ⚡ Projects "
color = "#6C91BF"

[[tool]]
name  = "cdx"
runs  = "codex --dangerously-bypass-approvals-and-sandbox"
label = " ✦ Codex "
color = "#A855F7"

# Several Claude accounts on one machine? Each lives in its own CLAUDE_CONFIG_DIR. `runs` goes
# through the shell, so an env prefix is all it takes — add one tool per profile and cycle them
# with ⇧⇥. Resume already picks the right profile on its own.
# [[tool]]
# name  = "work"
# runs  = "CLAUDE_CONFIG_DIR=~/.claude2 claude --permission-mode auto"
# label = " ⚡ Work account "
# color = "#4EA37A"

# ─── IDEs ────────────────────────────────────────────────────────────────────
# Each IDE binds an fzf-style ctrl-key: opens the editor, then launches the tool.
# `cmd` is run via the shell with $dir = the selected absolute path.
# Reserved keys (cannot be used): ctrl-f ctrl-p ctrl-t ctrl-n (and enter).
[[ide]]
key   = "ctrl-v"
label = "code"
cmd   = 'code "$dir"'

[[ide]]
key   = "ctrl-r"
label = "rider"
cmd   = 'open -a "Rider" "$dir"'

[[ide]]
key   = "ctrl-b"
label = "both"
cmd   = 'code "$dir"; open -a "Rider" "$dir"'

# ─── theme (optional) ────────────────────────────────────────────────────────
# [theme]
# accent = "#FF9F43"
